<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1020 1255" width="1020" height="1255" role="img" aria-labelledby="bagel-title bagel-desc">
  <title id="bagel-title">BAGEL Mixture-of-Transformers attention architecture</title>
  <desc id="bagel-desc">One pre-norm BAGEL decoder layer, repeated N times, shown bottom to top. Generation modules are red and understanding modules are blue. Intermediate token and activation tensors are gray. VAE latent tokens enter the generation branch. Text and ViT tokens enter the understanding branch. The visual path passes through ViT and connector input and output layers; a 2D position embedding is added to the connector output. Each decoder branch has its own pre-attention RMSNorm, query, key, value and output projections, query and key normalization, pre-MLP RMSNorm, and MLP with Gate, Up, and Down projections. Rotary position embeddings apply to queries and keys; values bypass these operations. Queries, keys and values from both branches are packed for attention, with access controlled by attention_mask. Attention outputs are routed back to the corresponding branch. Each branch has residual additions around attention and around its MLP.</desc>
  <metadata>Verified against ByteDance-Seed/Bagel commit a2fa77dd8caeefc41e6607ae0ec17408d3f4ee9f: modeling/bagel/qwen2_navit.py lines 381–497 and 687–755; modeling/bagel/bagel.py lines 77–87 and 165–185; modeling/bagel/modeling_utils.py lines 113–124; modeling/qwen2/modeling_qwen2.py Qwen2MLP. Diagram shows the train-time packed computation and parameter partition, without output heads, KV caches or training-freeze options.</metadata>
