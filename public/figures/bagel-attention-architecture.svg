<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1020 1120" width="1020" height="1120" role="img" aria-labelledby="bagel-title bagel-desc">
  <title id="bagel-title">BAGEL Mixture-of-Transformers attention architecture</title>
  <desc id="bagel-desc">One pre-norm BAGEL decoder layer, repeated N times, shown bottom to top. VAE latent tokens use generation parameters, shown in red. Text and ViT tokens use understanding parameters, shown in blue. Each branch has its own input RMSNorm, query, key, value and output projections, optional query and key normalization, post-attention RMSNorm, and feed-forward MLP. Rotary position embeddings apply to queries and keys; values bypass these operations. Queries, keys and values from both branches are packed for attention, with access controlled by attention_mask. Attention outputs are routed back to the corresponding branch. Each branch has residual additions around attention and around its MLP.</desc>
  <metadata>Verified against ByteDance-Seed/Bagel commit a2fa77dd8caeefc41e6607ae0ec17408d3f4ee9f: modeling/bagel/qwen2_navit.py lines 381–497 and 687–755; modeling/bagel/bagel.py lines 151–206. Diagram shows the train-time packed computation and parameter partition, without output heads, KV caches or training-freeze options.</metadata>
